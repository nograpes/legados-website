    columns: 2
    body: |
      Ce cours s’adresse aux bébés de familles hispanophones, accompagnés d’un parent.

      À travers la musique, les comptines, les histoires et le jeu sensoriel, les tout-petits s’éveillent à l’espagnol dans un climat doux, joyeux et affectif.

      Une première rencontre avec la langue, pleine d’émotions et de découvertes.

      Le cours se donne en présence des parents avec leur bébé.

      Ce premier contact, riche et joyeux, prépare aussi le terrain pour les autres langues de l’enfant, dont le français.

