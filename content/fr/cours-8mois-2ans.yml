  - type: text
    heading: Les objectifs
    columns: 2
    body: |
      Ce cours offre aux tout-petits un tout premier contact avec l’espagnol — tout en douceur, en rires et en émotions.

      Il s’agit aussi de la première exploration vocale et du mouvement corps + mot et livre.

      Notre but? Créer un lien affectif fort avec la langue à travers le jeu, la musique et les histoires.

      Dans un environnement sécurisant et chaleureux, les enfants s’éveillent à la langue par les sons, les gestes, les chansons et les expressions du quotidien. On sème les premières graines d’une communication vivante, joyeuse et spontanée.

      **Objectifs avec les bébés**

      - Compréhension auditive : réponse motrice (avec des gestes) aux chansons et au rythme
      - Acquisition de vocabulaire

      **Objectifs avec la famille**

      - Mettre en valeur la langue d’origine et les cultures

  - type: text
    color: grey
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: Notre approche pédagogique
    subheading: Apprendre une langue, c’est d’abord vivre avec elle
    body: |
      Dans ce cours, les enfants découvrent l’espagnol par le corps, le cœur et les sens. Les mots se mêlent aux gestes, les rires aux jeux, et les émotions aux chansons.

      À travers des activités musicales et ludiques, nous créons un espace d’exploration joyeux et sécurisant :

      - Des jeux qui permettent de toucher, bouger, ressentir… et apprendre sans s’en rendre compte.
      - Des poèmes et des histoires qui éveillent la curiosité et cultivent le goût des mots.
      - Des chansons qui font danser la langue et renforcent le lien affectif avec elle.

      L’espagnol devient peu à peu une langue vivante, aimée, ressentie. Un apprentissage naturel, qui prépare les enfants à une lecture amoureuse du monde.

