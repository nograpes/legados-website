        bio: |
          « Je suis chilienne, éducatrice de profession et par vocation. Au cours de mon parcours personnel et professionnel, je me suis intéressée à l’éducation interculturelle et à l’enseignement et l’apprentissage de l’espagnol. Je suis maman d’un petit multilingue chilien-canadien. »

