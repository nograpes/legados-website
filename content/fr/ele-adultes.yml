      - **Automne 2 :** 26 octobre – 14 décembre
      - **Hiver 1 :** 4 janvier – 26 février (inscriptions à partir du 15 novembre)
      - **Hiver 2 :** 1er mars – 23 avril (inscriptions à partir du 20 janvier)
      - **Printemps :** 26 avril – 18 juin (inscriptions à partir du 15 mars)

      | Niveau | Horaire |
