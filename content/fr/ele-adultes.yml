  - type: text
    image: /images/2025/10/cours-espagnol-montreal-prof-et-eleves.jpg
    image_side: left
    heading: Le test de classement
    body: |
      Il y a plusieurs niveaux pour ce cours. C’est pourquoi vous devez passer un test de classement, à moins que vous soyez complètement débutant (vous êtes alors au niveau A1.1).

      Les niveaux :

      - **A** = débutant (avec les sous-niveaux A1.1, A1.2, A2.1, etc.)
      - **B** = intermédiaire (avec les sous-niveaux)
      - **C** = avancé (avec les sous-niveaux)

      Chez Legados, les cours vont de A1 à C1.
    buttons:
      - { label: Je veux passer un test de classement, url: "https://legados.ca/test-de-classement/" }

  - type: cards
    color: grey
    heading: Ce que vous apprendrez
    cards:
      - title: L’espagnol de tous les jours
        text: |
          Les cours mettent l’accent sur l’usage réel de la langue, notamment :

          - grammaire et vocabulaire appliqués à des situations concrètes
          - compréhension écrite et orale
          - lecture, écriture et écoute active
      - title: Conversation, phonétique et culture
        text: |
          Une attention particulière est portée à l’oral :

          - amélioration de la prononciation et de la fluidité
          - développement de la confiance à l’oral
          - exploration de questions culturelles et sociales du monde hispanophone
      - title: Compétences interculturelles
        text: |
          Vous développerez :

          - une meilleure compréhension de la diversité culturelle
          - la capacité d’interagir avec sensibilité dans des contextes hispaniques variés

  - type: text
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: Caractéristiques des cours
    body: |
      ### Matériel pédagogique et ressources
      - Du matériel didactique spécialisé, conçu pour favoriser une immersion complète.
      - Un accès à notre [bibliothèque de livres espagnols](page:bibliotheque).
      - Des ateliers culturels intégrés au programme [Expérience culturelle](page:culture).

      ### Encadrement pédagogique
      Les cours sont assurés par des professeur·es hautement qualifié·es, spécialisé·es dans l’enseignement de l’espagnol comme langue étrangère.

      ### Manuels utilisés
      Les niveaux débutants (A1-A2) sont enseignés avec les livres [Experiencias modular](https://lasamericas.ca/fr/produits/29904/experiencias-modular-a1-libro-1). Le niveau intermédiaire B1 est enseigné avec [En Plural](https://lasamericas.ca/fr/produits/39668/en-plural-b1-libro-alumno).

  - type: people
    heading: Professeure du cours
    people:
      - name: Meli Marín
        photo: /images/2026/04/Meli-Marin_profe-ELE-adultos-y-Bibliotecaria-926x1024.webp
        bio: |
          « Je m’appelle Melina Marín et je vis à Córdoba, en Argentine. Depuis plus de 20 ans, j’enseigne l’anglais et l’espagnol, avec le bonheur d’accompagner chaque jour la découverte d’une nouvelle langue. Ce qui me lie à Legados, c’est le plaisir de transmettre et l’envie d’ouvrir, à travers l’espagnol, une fenêtre sur notre langue et notre culture. »

