  - type: text
    color: blue
    columns: 2
    body: |
      Les cours d’espagnol langue étrangère pour adultes offerts par Legados proposent une expérience d’apprentissage complète, efficace et rapide, alignée sur le [Cadre européen commun de référence pour les langues (CECR)](https://www.coe.int/fr/web/common-european-framework-reference-languages), un système de niveaux de cours reconnu mondialement.

      Nous garantissons un progrès dynamique dans votre apprentissage (parler, lire, écrire, écouter et comprendre les cultures). Vous serez accompagné par des enseignants hautement qualifiés, recourant à des méthodes novatrices et adaptées aux besoins des apprenants.

      **L’accent est mis sur la culture, les arts et la vie de tous les jours.**

