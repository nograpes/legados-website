    title: Les cours d’espagnol à Montréal de Legados

  - type: text
    color: red
    box: orange
    body: |
      Legados propose 2 programmes de cours d’espagnol :

      - [Espagnol langue maternelle](#elm)
      - [Espagnol langue étrangère](#ele)

      Le programme **Espagnol langue maternelle** s’adresse aux familles qui parlent espagnol à la maison.

      Vous souhaitez que vos enfants développent leur vocabulaire et approfondissent leur connaissance de la langue? Ce programme est pour vous. Un espagnol solide est aussi un appui pour réussir à l’école en français.

      Vous venez d’un milieu non hispanophone et vous souhaitez vous mettre à l’espagnol? Vous trouverez votre bonheur avec notre programme **Espagnol langue étrangère**.

      Tous nos cours sont donnés par des professeures d’expérience, diplômées, qui ont l’espagnol comme langue maternelle.

      Legados suit un programme pédagogique rigoureux. Notre directrice, Mariana Marín, a une maîtrise en anthropologie et termine une maîtrise en didactique des langues (spécialisation en espagnol) à l’Université de Montréal.

      Legados marie le plaisir à la rigueur.

