  - type: text
    color: blue
    columns: 2
    body: |
      Cours idéal pour initier les jeunes à l’espagnol comme langue étrangère dans un cadre ludique, créatif et immersif, spécialement adapté à leur âge.

      L’apprentissage se fait naturellement : les enfants découvrent l’espagnol en jouant, en chantant, en bougeant, en créant et en échangeant.

      L’objectif n’est pas seulement de comprendre une langue étrangère, mais de la vivre, de s’y sentir à l’aise et d’y prendre plaisir.

  - type: facts
    color: orange
    items:
      - "> Enfants 7 à 12 ans\n> Espagnol langue étrangère"
