  - type: text
    color: red
    columns: 2
    body: |
      Le programme Bicyclette est divisé en 3 niveaux : débutant, intermédiaire, avancé. Tout le programme s’appuie sur la littérature latino-américaine, qui constitue le fil conducteur de l’apprentissage de la langue.

      Les enfants développent la langue et leur sens artistique, tout en explorant leur créativité et leur imagination.

      Aux niveaux 1 et 2, le chant et la musique accompagnent les activités et soutiennent l’acquisition du vocabulaire et des structures de base.

      Au niveau 3, d’autres disciplines artistiques sont introduites, comme le théâtre et le balado (podcasting).

      L’ensemble transforme l’apprentissage de la langue en une expérience à la fois joyeuse et profondément culturelle.

      En lisant et en écrivant en espagnol, les enfants renforcent des compétences — vocabulaire, compréhension, lecture — qui les aident aussi à réussir à l’école en français.

