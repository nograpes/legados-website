  - type: text
    image: /images/2026/05/Bicicleta-enfants-dans-cours-espagnol.webp
    image_side: left
    body: |
      Bicyclette, ce n’est pas seulement un cours d’espagnol : c’est un espace où les enfants apprennent à penser, créer et s’exprimer en espagnol, tout en approfondissant leurs liens avec leur culture d’origine.

      Bicyclette a pour mission de nourrir la langue, la tête… et le cœur.

  - type: cards
    color: yellow
    heading: Les objectifs
    cards:
      - title: Renforcer le lien avec la langue et la culture
        text: Les enfants travaillent à partir de matériel authentique, soigneusement sélectionné pour refléter leurs réalités, leurs centres d’intérêt et leurs besoins en tant qu’enfants hispanophones vivant au Québec. Ils développent ainsi un rapport personnel, vivant et affectif avec la langue.
      - title: Favoriser une conscience interculturelle
        text: "À travers des thèmes liés à la réalité latino-canadienne, les enfants explorent leur identité multiple. L’espagnol devient plus qu’un outil de communication : c’est un pont entre leurs racines et le monde qui les entoure. Nous valorisons qui ils sont, ici et maintenant."
      - title: Apprendre par l’art et l’expérience
        text: "Grâce à notre approche artistique intégrée (musique, théâtre, arts visuels, littérature), les apprentissages linguistiques prennent vie dans des projets concrets et créatifs. Il s’agit d’un apprentissage qui se ressent et qui se vit : une véritable immersion culturelle et sensorielle."

  - type: text
    color: grey
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: 3 niveaux pour grandir en espagnol
    body: |
      Bicyclette est davantage un programme qu’un cours, puisqu’il est structuré en 3 niveaux. À travers des textes de la riche littérature latino-américaine, par le biais d’échanges et de projets créatifs, les enfants développent leurs compétences linguistiques tout en approfondissant leur lien avec la culture hispanophone.

      ### Bicyclette 1 – débutant
      Au rythme des lectures, des chansons et des jeux, les enfants développent leurs capacités à décrire, raconter et interagir en espagnol. L’expression écrite émerge progressivement, soutenue par la musique, les échanges en classe et la découverte de différentes cultures du monde hispanophone. L’enrichissement du vocabulaire constitue un pilier de ce premier niveau. La sélection littéraire est adaptée à l’âge des enfants et propose une grande diversité de thèmes, renouvelés chaque semaine, afin de maintenir la curiosité et le plaisir d’apprendre.

      ### Bicyclette 2 – intermédiaire
      Ce niveau permet de consolider les bases linguistiques : vocabulaire, grammaire, compréhension et expression orale et écrite. Les apprenants progressent dans l’utilisation de formes narratives et argumentatives plus structurées. Chaque session s’articule autour d’un thème central (la nature, l’amitié, les migrations, etc.), exploré à travers des textes littéraires plus développés et des discussions qui élargissent les horizons linguistiques et culturels.

      ### Bicyclette 3 – avancé
      Place à la création. Ce niveau s’adresse aux enfants qui sont déjà à l’aise en espagnol et souhaitent développer une expression plus nuancée et personnelle. L’apprentissage se déploie à travers une discipline artistique. Cette année, le balado (podcasting) accompagne le travail linguistique. Legados dispose déjà de son balado, *Montaña Rusa*, et les élèves de Bicicleta 3 contribuent à cette émission diffusée sur Spotify.

      La création audio offre une occasion concrète de pratiquer l’écriture, la lecture expressive et la communication orale. Le cours met en valeur différents genres d’écriture (créatif, journalistique, argumentatif), en lien avec la réalité latino-canadienne.

  - type: people
    heading: Professeures du cours
    people:
      - name: Mariana Marín
        role: Professeure de Bicyclette 1 et 2
        photo: /images/2026/03/Mariana-legados-edited.webp
        bio: |
          « Je travaille actuellement à la rédaction de mon mémoire de maîtrise en études hispaniques à l’Université de Montréal. Mes recherches portent sur la façon dont a été conçu le programme d’espagnol langue maternelle (aussi appelé langue d’héritage) de l’institut Legados. J’ai une licence en communication sociale et une maîtrise en anthropologie sociale. Je suis aussi mère de trois enfants qui grandissent entre plusieurs langues. Je suis argentine, latino-canadienne et fondatrice de Legados.

          Comme immigrante vivant au Canada, j’ai toujours accordé beaucoup d’importance à la possibilité de vivre entre les langues. Comme l’écrit Sylvia Molloy, l’idée n’est pas qu’une langue remplace l’autre, mais qu’elles puissent s’ajouter l’une à l’autre. »
      - name: Camila Saland
        role: Professeure de Bicyclette 3
        photo: /images/2026/04/Camila-Saland-prof-espagnol-edited-2.jpeg
        bio: |
          « J’ai obtenu mon baccalauréat en linguistique à l’Université McGill. J’ai grandi à New York et je suis trilingue : je parle espagnol, anglais et français. Je m’intéresse à la réalité sociolinguistique des hispanophones dans un contexte de langue d’origine, ainsi qu’à la création d’outils d’apprentissage. Dans mes temps libres, j’aime faire du vélo, pratiquer la photographie analogique et lire. »

