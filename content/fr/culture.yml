  - type: text
    image: /images/2026/04/femme-dansante2000x1333-1024x682.webp
    image_side: left
    heading: "Legados, c’est aussi la culture latino-américaine : chant, littérature, cuisine, dessin, danse"
    body: |
      Legados vous invite à une immersion joyeuse dans la culture latino-américaine.

      La culture qui se vit en chantant, qui s’écrit en espagnol et en poésie, qui se cuisine à petit feu et se savoure sur le coin d’une table.

      La culture qui s’exprime par la danse, le dessin, les mots, les couleurs et les gestes.

      À travers nos ateliers créatifs, nos fêtes culturelles, nos lectures, nos projets d’art et nos recettes partagées, petits et grands découvrent une culture vibrante, chaleureuse et inclusive.

      Chez Legados, apprendre une langue, c’est aussi entrer en relation avec un monde vivant.

