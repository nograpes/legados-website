  title: Présentation de Legados
  heading: Legados est une école de langue et un institut culturel
  body: 'Né de l’expérience de l’immigration et d’un lien profond avec la langue, Legados invite à découvrir l’espagnol à travers ses histoires, ses voix et ses imaginaires.


    Cours, ateliers et activités culturelles créent un espace de rencontre où enfants, jeunes et adultes apprennent la langue tout en approfondissant une culture et en découvrant une communauté.'
