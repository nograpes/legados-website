  - type: text
    color: blue
    box: yellow
    align: center
    heading: Legados est une école de langue et un institut culturel. Pour enfants et adultes.
    body: |
      Né de l’expérience de l’immigration et d’un lien profond avec la langue, Legados invite à découvrir l’espagnol à travers ses histoires, ses voix et ses imaginaires.

      Cours, ateliers et activités culturelles créent un espace de rencontre où enfants, jeunes et adultes apprennent la langue tout en approfondissant une culture et en découvrant une communauté.

