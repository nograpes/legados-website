key: qui-sommes-nous
slug: a-propos/qui-sommes-nous
title: Qui sommes-nous
description: Legados est un institut latino-américain de transmission de la langue et de la culture, organisme de bienfaisance fondé en 2017 dans le Mile-End, à Montréal.
sections:
  - type: page_title
    title: Qui sommes-nous
    align: center

  - type: text
    color: red
    image: /images/2025/12/legados-une-histoire-d-immigration.jpg
    image_side: right
    heading: Un institut latino-américain de transmission de la langue et de la culture
    body: |
      Legados est un organisme de bienfaisance enregistré, fondé en 2017 dans le Mile-End, à Montréal. Son nom signifie « héritages » en espagnol.

      Il est né de l’expérience de sa fondatrice, mère immigrante latino-américaine, et du désir de garder l’espagnol vivant d’une génération à l’autre — notamment pour les enfants qui grandissent avec l’espagnol à la maison et le français à l’école.

      Ancré dans la communauté, Legados accompagne directement les familles hispanophones de Montréal. Son programme d’espagnol langue d’héritage, qui allie la langue à la littérature, aux arts et à la culture latino-américaine, a été développé en réponse aux besoins exprimés par les familles elles-mêmes.

  - type: quote
    image: /images/2025/12/Mariana-legados.webp
    text: « J’ai vu l’espagnol de mes filles s’effacer peu à peu, et j’ai compris que le parler à la maison ne suffisait pas. Les enfants ont aussi besoin de lire, d’écrire, d’enrichir leur vocabulaire et de connaître leur culture. C’est de là qu’est né Legados. »
    author: Mariana Marín
    role: Fondatrice de Legados

  - type: text
    id: mission
    color: yellow
    heading: Notre mission
    body: |
      Legados a pour mission de favoriser la transmission et le développement de la langue espagnole et des cultures latino-américaines à Montréal.

      Par ses cours, ses ateliers et ses activités culturelles et artistiques, Legados crée des espaces d’apprentissage, de création, de rencontre et d’engagement citoyen, ouverts à toutes et à tous. Une attention particulière est portée aux familles issues de l’immigration, pour qui la langue d’origine est un patrimoine vivant et un appui pour bien s’intégrer.

      Par sa mission éducative et culturelle, Legados contribue à la vitalité de la diversité culturelle montréalaise et au renforcement du sentiment d’appartenance et de participation des communautés hispanophones et latino-américaines à la société québécoise.

  - type: text
    image: /images/2025/12/Legados_cours-espagnol-etudiants-7-1-1024x683.png
    image_side: left
    heading: Une langue maternelle solide aide à apprendre le français
    body: |
      Les enfants immigrants ou nouvellement arrivés apprennent le français à l’école alors que leur langue maternelle présente souvent des lacunes. Cela peut freiner leur communication, leur participation en classe et leur confiance, surtout lorsque leur parcours scolaire a été interrompu.

      La recherche montre que ce qu’un enfant maîtrise dans sa langue maternelle — vocabulaire, compréhension, lecture — se transfère à l’apprentissage du français. C’est d’ailleurs le principe du Programme d’enseignement des langues d’origine (PELO) du ministère de l’Éducation du Québec.

      L’enfant y gagne aussi confiance et identité : une base solide pour participer pleinement à la vie québécoise, en français, tout en gardant le lien avec sa famille.

  - type: cards
    color: orange
    heading: Ce que nous faisons
    body: Legados répond à la perte de la langue d’héritage chez les enfants de familles immigrantes et multilingues par un enseignement de l’espagnol ancré dans la culture, l’identité et le vécu.
    cards:
      - title: Pour les enfants
        text: Des cours adaptés à chaque âge, du matériel culturellement pertinent, des ateliers artistiques et des expériences d’immersion, pour que les enfants comprennent, parlent, lisent et écrivent l’espagnol avec confiance, en complément du français appris à l’école.
      - title: Au-delà de Legados
        text: Nous développons une pédagogie propre à l’espagnol langue d’héritage, et des outils que des organismes partenaires, des écoles et d’autres milieux communautaires pourront utiliser à leur tour.
      - title: Pour les familles et la société québécoise
        text: Une langue d’héritage solide nourrit la communication entre les générations. Nos cours et activités, ouverts à tous, sont aussi un lieu de rencontre entre Québécois de toutes origines. Legados a aussi collaboré avec des professionnel·les qui accompagnent des enfants nouvellement arrivés ayant un retard de langage.

  - type: text
    color: grey
    image: /images/2025/12/filosofia-teatro-web.jpg
    image_side: right
    heading: Notre approche
    body: |
      Faire vivre la langue par la culture. On apprend l’espagnol en parlant, en lisant, en créant et en échangeant : la littérature latino-américaine est au cœur des cours, et le théâtre, la musique et les arts soutiennent l’expression.

      Nous offrons des programmes d’espagnol langue maternelle et langue étrangère, des ateliers culturels (tango, écriture créative, chorale) et une bibliothèque d’environ 1 200 livres en espagnol, gratuite pour nos élèves.

      Depuis plus de huit ans, cette approche se construit entre pratique en classe et recherche, avec des spécialistes comme Silvina Montrul et Kim Potowski (University of Illinois) et Enrique Pato (Université de Montréal). Notre premier livre pédagogique, *Monopatín 1*, a été testé en classe pendant trois ans; nous travaillons maintenant à en faire une plateforme numérique et à créer de nouveaux niveaux, pour rejoindre des milliers de familles en Amérique du Nord.
