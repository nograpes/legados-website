title: Qui sommes-nous
description: Legados est un institut latino-américain de transmission de la langue et de la culture, organisme de bienfaisance fondé en 2017 dans le Mile-End, à Montréal.
sections:
  - type: page_title
    title: Qui sommes-nous
    align: center

  - type: text
    color: red
    image: /images/2025/12/legados-une-histoire-d-immigration.jpg
    image_side: right
    heading: Un institut latino-américain de transmission de la langue et de la culture
    body: |
      Legados est un organisme de bienfaisance enregistré, fondé en 2017 dans le Mile-End, à Montréal. Son nom signifie « héritages » en espagnol.

      Il est né de l’expérience de sa fondatrice, mère immigrante latino-américaine, et du désir de garder l’espagnol vivant d’une génération à l’autre — notamment pour les enfants qui grandissent avec l’espagnol à la maison, dans un environnement francophone et anglophone.

      Ancré dans la communauté, Legados accompagne directement les familles hispanophones de Montréal. Son programme d’espagnol langue d’héritage, qui allie la langue à la littérature, aux arts et à la culture latino-américaine, a été développé en réponse aux besoins exprimés par les familles elles-mêmes.

  - type: text
    id: mission
    color: yellow
    heading: Notre mission
    body: |
      Legados a pour mission de favoriser la transmission et le développement de la langue espagnole et des cultures latino-américaines à Montréal.

      Par ses cours, ses ateliers et ses activités culturelles et artistiques, Legados crée des espaces d’apprentissage, de création et de rencontre où la langue devient un lien entre les générations. Une attention particulière est portée aux familles issues de l’immigration, pour qui la langue d’origine est un patrimoine vivant. Legados contribue ainsi à la vitalité de la diversité culturelle montréalaise et au sentiment d’appartenance des communautés latino-américaines.

  - type: text
    image: /images/2025/12/Legados_cours-espagnol-etudiants-7-1-1024x683.png
    image_side: left
    heading: Pourquoi la langue d’héritage est importante
    body: |
      Les enfants immigrants ou nouvellement arrivés apprennent souvent le français ou l’anglais alors que leur langue maternelle présente des lacunes. Cela peut freiner leur communication, leur participation à l’école, leur confiance et leurs liens avec leur famille, surtout lorsque leur parcours scolaire a été interrompu.

      Renforcer la langue d’héritage consolide les bases — vocabulaire, compréhension, communication — qui facilitent l’apprentissage d’une nouvelle langue. L’enfant y gagne aussi confiance et identité : une base solide pour participer pleinement à sa nouvelle communauté, tout en restant lié à sa famille et à sa culture.

  - type: cards
    color: orange
    heading: Ce que nous faisons
    body: Legados répond à la perte de la langue d’héritage chez les enfants de familles immigrantes et multilingues par un enseignement de l’espagnol ancré dans la culture, l’identité et le vécu.
    cards:
      - title: Pour les enfants
        text: Des cours adaptés à chaque âge, du matériel culturellement pertinent, des ateliers artistiques et des expériences d’immersion, pour que les enfants comprennent, parlent, lisent et écrivent l’espagnol avec confiance, tout en apprenant le français ou l’anglais.
      - title: Au-delà de Legados
        text: Nous développons une pédagogie propre à l’espagnol langue d’héritage, et des outils que des organismes partenaires, des écoles et d’autres milieux communautaires pourront utiliser à leur tour.
      - title: Pour les familles et la communauté
        text: Une langue d’héritage solide nourrit la communication entre les générations et l’identité culturelle. Legados a aussi collaboré avec des professionnel·les qui accompagnent des enfants nouvellement arrivés ayant un retard de langage.

  - type: text
    color: grey
    image: /images/2025/12/filosofia-teatro-web.jpg
    image_side: right
    heading: Notre approche
    body: |
      Faire vivre la langue par la culture. On apprend l’espagnol en parlant, en lisant, en créant et en échangeant : la littérature latino-américaine est au cœur des cours, et le théâtre, la musique et les arts soutiennent l’expression.

      Nous offrons des programmes d’espagnol langue maternelle et langue étrangère, des ateliers culturels (tango, écriture créative, chorale) et une bibliothèque d’environ 1 200 livres en espagnol, gratuite pour nos élèves.
