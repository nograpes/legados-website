  - type: text
    color: red
    align: center
    body: |
      ### Enfants, jeunes et adultes, familles hispanophones ou curieux de l’espagnol : choisir Legados, c’est rejoindre un lieu où l’espagnol est vivant et où les héritages dialoguent.
