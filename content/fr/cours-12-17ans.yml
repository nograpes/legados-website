  - type: text
    color: red
    columns: 2
    body: |
      Passage est un cours en personne, en groupe, pensé pour les jeunes de 12 à 17 ans ayant déjà un niveau intermédiaire en espagnol. C’est un espace où l’on renforce ses compétences linguistiques, bien sûr — mais surtout, où l’on grandit avec la langue.

      Ici, les ados pratiquent l’expression orale et écrite, découvrent de nouveaux mots, affinent leur grammaire… tout en explorant des thèmes essentiels comme la citoyenneté, les droits humains et la diversité culturelle.

      À travers des lectures, des discussions, des projets artistiques et des activités d’immersion dans leur communauté, les élèves tissent des liens entre leur langue, leur culture et le monde qui les entoure.

      Passage, c’est bien plus qu’un cours : c’est une traversée personnelle, culturelle et citoyenne. Un chemin pour apprendre à s’exprimer, se situer… et se révéler. Un cours d’espagnol qui mène loin.

      Les compétences développées en espagnol — lire, argumenter, écrire — se transfèrent au français et soutiennent la réussite scolaire.

