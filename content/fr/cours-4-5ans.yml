  - type: text
    color: red
    columns: 2
    body: |
      Ce cours d’espagnol langue maternelle s’adresse aux enfants issus de familles hispanophones.

      Il permet d’élargir et de développer l’espagnol que les enfants apportent de la maison, en renforçant les variantes qu’ils connaissent déjà, avec un accent sur l’acquisition et l’enrichissement du lexique.

      Chaque classe utilise comme outils pédagogiques une lecture du jour (contes latino-américains, poèmes, fables et autres) ainsi qu’une chanson associée, afin de proposer des activités interactives qui consolident le vocabulaire et l’expression orale en espagnol.

      Un espagnol solide est aussi un appui pour l’entrée à l’école en français : ce que l’enfant maîtrise dans sa langue maternelle l’aide à apprendre une nouvelle langue.

