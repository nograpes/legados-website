title: Spanish classes in Montreal
description: Spanish classes for heritage speakers and for learners of Spanish as a foreign language — children, teens and adults — in Montreal’s Mile-End.
sections:
  - type: page_title
    title: Legados Spanish classes in Montreal

  - type: text
    color: red
    box: orange
    body: |
      Legados offers 2 Spanish programs:

      - [Spanish as a heritage language](#elm)
      - [Spanish as a foreign language](#ele)

      The **Spanish as a heritage language** program is for Spanish-speaking families.

      Do you speak Spanish at home and want your children to build their vocabulary and deepen their knowledge of the language? This program is for you.

      Do you come from a non-Spanish-speaking background and want to start learning Spanish? Our **Spanish as a foreign language** program is the right fit.

      All our classes are taught by experienced, qualified teachers whose first language is Spanish.

      Legados follows a rigorous teaching program. Our director, Mariana Marín, holds a master’s degree in anthropology and is completing a master’s in language teaching (Spanish specialization) at the Université de Montréal.

      At Legados, learning is both fun and rigorous.

