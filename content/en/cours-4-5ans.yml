  - type: text
    color: blue
    columns: 2
    body: |
      This heritage-language Spanish class is for children from Spanish-speaking families.

      It broadens and develops the Spanish children bring from home, strengthening the varieties they already know, with a focus on building and enriching vocabulary.

      Each class uses a reading of the day (Latin American tales, poems, fables and more) and a related song as teaching tools, with interactive activities that reinforce vocabulary and spoken Spanish.

  - type: facts
    color: orange
    items:
