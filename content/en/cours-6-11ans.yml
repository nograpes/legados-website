  - type: text
    image: /images/2026/05/Bicicleta-enfants-dans-cours-espagnol.webp
    image_side: left
    body: |
      Bicycle is not just a Spanish class: it is a space where children learn to think, create and express themselves in Spanish, while deepening their ties with their culture of origin.

      Bicycle’s mission is to nourish the language, the mind… and the heart.

  - type: cards
    color: yellow
    heading: Goals
    cards:
      - title: Strengthen the bond with the language and culture
        text: Children work with authentic material, carefully chosen to reflect their realities, interests and needs as Spanish-speaking children living in Quebec. They build a personal, lively and emotional relationship with the language.
      - title: Foster intercultural awareness
        text: "Through themes tied to Latin-Canadian life, children explore their multiple identities. Spanish becomes more than a means of communication: it is a bridge between their roots and the world around them. We value who they are, here and now."
      - title: Learn through art and experience
        text: "With our integrated arts approach (music, theatre, visual arts, literature), language learning comes alive in concrete, creative projects. It is learning you feel and live: a true cultural and sensory immersion."

  - type: text
    color: grey
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: 3 levels to grow in Spanish
    body: |
      Bicycle is more a program than a class, since it has 3 levels. Through texts from rich Latin American literature, conversation and creative projects, children develop their language skills while deepening their connection with Hispanic culture.

      ### Bicycle 1 – beginner
      Through readings, songs and games, children develop their ability to describe, tell stories and interact in Spanish. Writing emerges gradually, supported by music, class discussion and the discovery of different cultures of the Spanish-speaking world. Building vocabulary is a pillar of this first level. The readings are chosen for the children’s age and cover a wide variety of themes, renewed every week to keep curiosity and the joy of learning alive.

      ### Bicycle 2 – intermediate
      This level consolidates the basics: vocabulary, grammar, comprehension, and spoken and written expression. Learners progress toward more structured narrative and argumentative forms. Each session is built around a central theme (nature, friendship, migration, etc.), explored through longer literary texts and discussions that broaden linguistic and cultural horizons.

      ### Bicycle 3 – advanced
      Time to create. This level is for children who are already comfortable in Spanish and want to develop a more nuanced, personal voice. Learning happens through an art form; this year, podcasting supports the language work. Legados already has its own podcast, *Montaña Rusa*, and Bicicleta 3 students contribute to the show, which airs on Spotify.

      Audio production is a concrete way to practise writing, expressive reading and oral communication. The class explores different genres of writing (creative, journalistic, argumentative), connected to Latin-Canadian life.

  - type: people
    heading: Teachers
    people:
      - name: Mariana Marín
        role: Teacher, Bicycle 1 and 2
        photo: /images/2026/03/Mariana-legados-edited.webp
        bio: |
          “I am currently writing my master’s thesis in Hispanic studies at the Université de Montréal. My research looks at how the Legados heritage-language Spanish program was designed. I have a degree in social communication and a master’s in social anthropology. I’m also the mother of three children growing up between several languages. I’m Argentinian, Latin-Canadian and the founder of Legados.

          As an immigrant living in Canada, I have always cared about being able to live between languages. As Sylvia Molloy wrote, the idea is not for one language to replace the other, but for them to add up.”
      - name: Camila Saland
        role: Teacher, Bicycle 3
        photo: /images/2026/04/Camila-Saland-prof-espagnol-edited-2.jpeg
        bio: |
          “I earned my bachelor’s degree in linguistics at McGill University. I grew up in New York and I’m trilingual: I speak Spanish, English and French. I’m interested in the sociolinguistic reality of Spanish speakers in a heritage-language context, and in creating learning tools. In my free time, I enjoy cycling, film photography and reading.”

