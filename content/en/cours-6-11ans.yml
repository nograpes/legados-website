  - type: text
    color: red
    columns: 2
    body: |
      The Bicycle program has 3 levels: beginner, intermediate and advanced. The whole program is built on Latin American literature, the common thread of language learning.

      Children develop their language and their artistic sense while exploring their creativity and imagination.

      At levels 1 and 2, singing and music accompany the activities and support the learning of vocabulary and basic structures.

      At level 3, other art forms are introduced, such as theatre and podcasting.

      Altogether, language learning becomes an experience that is both joyful and deeply cultural.

