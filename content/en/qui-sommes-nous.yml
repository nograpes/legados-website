key: qui-sommes-nous
slug: about/who-we-are
title: Who we are
description: Legados is a Latin American Institute for Language and Cultural Transmission, a registered charity founded in 2017 in Montreal’s Mile End.
sections:
  - type: page_title
    title: Who we are
    align: center

  - type: text
    color: red
    image: /images/2025/12/legados-une-histoire-d-immigration.jpg
    image_side: right
    heading: A Latin American Institute for Language and Cultural Transmission
    body: |
      Legados is a registered charity founded in 2017 in Montréal’s Mile End. Its name means “heritage” in Spanish.

      It grew out of its founder’s experience as a Latin American immigrant mother, and the wish to keep Spanish alive across generations — especially for children growing up with Spanish at home in a mostly French- and English-speaking environment.

      Rooted in the community, Legados works directly with Spanish-speaking families in Montréal. Its Spanish Heritage Language program combines language learning with Latin American literature, arts and culture, and was developed in response to needs identified by families themselves.

  - type: text
    id: mission
    color: yellow
    heading: Our mission
    body: |
      Legados’s mission is to promote the transmission and development of the Spanish language and Latin American cultures in Montreal.

      Through classes, workshops, and cultural and artistic activities, Legados creates spaces for learning, creativity and community where language becomes a bond between generations. We pay particular attention to families with immigrant backgrounds, for whom their native language is a living heritage. In this way, Legados contributes to Montreal’s cultural diversity and to the sense of belonging of Latin American communities.

  - type: text
    image: /images/2025/12/Legados_cours-espagnol-etudiants-7-1-1024x683.png
    image_side: left
    heading: Why the heritage language matters
    body: |
      Newly arrived and immigrant children often learn French or English while their first language has gaps. This can hold back their communication, school participation, confidence and connection with their families — especially when their schooling has been disrupted.

      Strengthening the heritage language builds the foundations — vocabulary, comprehension, communication — that make learning a new language easier. Children also gain confidence and a strong sense of identity: a secure base from which to take part fully in their new community while staying connected to their family and culture.

  - type: cards
    color: orange
    heading: What we do
    body: Legados addresses the loss of heritage-language skills among children from immigrant and multilingual families through Spanish-language education rooted in culture, identity and lived experience.
    cards:
      - title: For children
        text: Age-appropriate classes, culturally relevant materials, arts workshops and immersion experiences, so children understand, speak, read and write Spanish with confidence while they learn French or English.
      - title: Beyond Legados
        text: We are developing a teaching approach designed specifically for Spanish as a heritage language, with materials that partner organizations, schools and other community settings can use too.
      - title: For families and the community
        text: Strong heritage-language skills support communication between generations and cultural identity. Legados has also worked with professionals supporting newly arrived children with language delays.

  - type: text
    color: grey
    image: /images/2025/12/filosofia-teatro-web.jpg
    image_side: right
    heading: Our approach
    body: |
      We bring language to life through culture. Spanish is learned by speaking, reading, creating and sharing: Latin American literature is at the heart of our classes, with theatre, music and the arts supporting expression.

      We offer Spanish programs for heritage and foreign language learners, cultural workshops (tango, creative writing, choir) and a library of about 1,200 Spanish-language books, free for our students.
