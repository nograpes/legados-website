slug: about/who-we-are
title: Who we are
description: Legados is a Latin American Institute for Language and Cultural Transmission, a registered charity founded in 2017 in Montreal’s Mile End.
sections:
  - type: page_title
    title: Who we are
    align: center

  - type: text
    color: red
    image: /images/2025/12/legados-une-histoire-d-immigration.jpg
    image_side: right
    heading: A Latin American Institute for Language and Cultural Transmission
    body: |
      Legados is a registered charity founded in 2017 in Montréal’s Mile End. Its name means “heritage” in Spanish.

      It grew out of its founder’s experience as a Latin American immigrant mother, and the wish to keep Spanish alive across generations — especially for children growing up with Spanish at home and French at school.

      Rooted in the community, Legados works directly with Spanish-speaking families in Montréal. Its Spanish Heritage Language program combines language learning with Latin American literature, arts and culture, and was developed in response to needs identified by families themselves.

  - type: quote
    image: /images/2025/12/Mariana-legados.webp
    text: “I watched my daughters’ Spanish slowly fade, and realized that speaking it at home wasn’t enough. Children also need to read, write, grow their vocabulary and know their culture. That’s how Legados began.”
    author: Mariana Marín
    role: Founder of Legados

  - type: text
    id: mission
    color: yellow
    heading: Our mission
    body: |
      Legados’s mission is to promote the transmission and development of the Spanish language and Latin American cultures in Montreal.

      Through classes, workshops, and cultural and artistic activities, Legados creates spaces for learning, creativity, community and civic engagement, open to everyone. We pay particular attention to families with immigrant backgrounds, for whom their native language is a living heritage and a foundation for successful integration.

      Through its educational and cultural mission, Legados contributes to the vitality of Montreal’s cultural diversity and to strengthening the sense of belonging and participation of Spanish-speaking and Latin American communities in Quebec society.

  - type: text
    image: /images/2025/12/Legados_cours-espagnol-etudiants-7-1-1024x683.png
    image_side: left
    heading: A strong first language helps children learn French
    body: |
      Newly arrived and immigrant children learn French at school while their first language often has gaps. This can hold back their communication, participation in class and confidence — especially when their schooling has been disrupted.

      Research shows that what children master in their first language — vocabulary, comprehension, reading — carries over to learning French. It is the same principle behind Quebec’s Ministry of Education heritage-language program (PELO).

      Children also gain confidence and a strong sense of identity: a secure base from which to take part fully in Quebec life, in French, while staying connected to their family.

  - type: cards
    color: orange
    heading: What we do
    body: Legados addresses the loss of heritage-language skills among children from immigrant and multilingual families through Spanish-language education rooted in culture, identity and lived experience.
    cards:
      - title: For children
        text: Age-appropriate classes, culturally relevant materials, arts workshops and immersion experiences, so children understand, speak, read and write Spanish with confidence, alongside the French they learn at school.
      - title: Beyond Legados
        text: We are developing a teaching approach designed specifically for Spanish as a heritage language, with materials that partner organizations, schools and other community settings can use too.
      - title: For families and Quebec society
        text: Strong heritage-language skills support communication between generations. Our classes and activities, open to everyone, are also a meeting place for Quebecers of all backgrounds. Legados has also worked with professionals supporting newly arrived children with language delays.

  - type: text
    color: grey
    image: /images/2025/12/filosofia-teatro-web.jpg
    image_side: right
    heading: Our approach
    body: |
      We bring language to life through culture. Spanish is learned by speaking, reading, creating and sharing: Latin American literature is at the heart of our classes, with theatre, music and the arts supporting expression.

      We offer Spanish programs for heritage and foreign language learners, cultural workshops (tango, creative writing, choir) and a library of about 1,200 Spanish-language books, free for our students.

      For more than eight years, this approach has been built through classroom practice and research, with specialists including Silvina Montrul and Kim Potowski (University of Illinois) and Enrique Pato (Université de Montréal). Our first textbook, *Monopatín 1*, has been tested in classrooms for three years; we are now turning it into a digital platform and developing new levels, to reach thousands of families across North America.
