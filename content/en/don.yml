    heading: A teaching platform
    subheading: Our ambition is to share the Spanish language and Hispanic culture in Montreal and beyond.
    body: |
      Your donations will support the development of a digital teaching platform.

      The platform will include training tools, books and thematic workbooks.

      The goal is to improve access to content and harmonize teaching practices, to better serve our learners — including beyond Montreal.

      **You will receive a tax receipt.**

      Legados is a registered charity, registration number 793483884.
