  - type: text
    image: /images/2026/04/femme-dansante2000x1333-1024x682.webp
    image_side: left
    heading: "Legados is also Latin American culture: song, literature, cooking, drawing, dance"
    body: |
      Legados invites you to a joyful immersion in Latin American culture.

      Culture you live by singing, that is written in Spanish and in poetry, that simmers slowly on the stove and is savoured around a table.

      Culture expressed through dance, drawing, words, colours and gestures.

      Through our creative workshops, cultural celebrations, readings, art projects and shared recipes, young and old discover a vibrant, warm and inclusive culture.

      At Legados, learning a language also means connecting with a living world.

