  - type: text
    heading: Goals
    columns: 2
    body: |
      This class gives the very youngest children their first contact with Spanish — gently, with laughter and emotion.

      It is also a first exploration of voice and movement: body + word, and books.

      Our goal? To build a strong emotional bond with the language through play, music and stories.

      In a safe and warm setting, children awaken to the language through sounds, gestures, songs and everyday expressions. We sow the first seeds of lively, joyful and spontaneous communication.

      **Goals for the babies**

      - Listening comprehension: responding with movement (gestures) to songs and rhythm
      - Building vocabulary

      **Goals for the family**

      - Valuing the language of origin and its cultures

  - type: text
    color: grey
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: Our teaching approach
    subheading: Learning a language starts with living with it
    body: |
      In this class, children discover Spanish through their bodies, their hearts and their senses. Words blend with gestures, laughter with games, and feelings with songs.

      Through musical and playful activities, we create a joyful and safe space to explore:

      - Games to touch, move and feel… and learn without even noticing.
      - Poems and stories that spark curiosity and a love of words.
      - Songs that make the language dance and strengthen the bond with it.

      Little by little, Spanish becomes a living language — loved and felt. A natural way of learning that prepares children to read the world with love.

  - type: people
