  title: Introducing Legados
  heading: Legados is a language school and a cultural institute
  body: 'Born of the immigrant experience and a deep bond with language, Legados invites you to discover Spanish through its stories, its voices and its imagination.


    Classes, workshops and cultural activities create a meeting place where children, teens and adults learn the language while deepening their knowledge of a culture and discovering a community.'
