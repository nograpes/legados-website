  - type: text
    color: red
    columns: 2
    body: |
      Passage is an in-person group class for teens aged 12 to 17 who already have an intermediate level of Spanish. It is a space to strengthen language skills, of course — but above all, to grow with the language.

      Here, teens practise speaking and writing, learn new words and polish their grammar… while exploring essential themes such as citizenship, human rights and cultural diversity.

      Through readings, discussions, art projects and immersion activities in their community, students connect their language, their culture and the world around them.

      Passage is much more than a class: it is a personal, cultural and civic journey. A path to learn to express themselves, find their place… and discover who they are. A Spanish class that takes you far.

      The skills built in Spanish — reading, arguing a point, writing — carry over to French and support success at school.

