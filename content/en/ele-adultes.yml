  - type: text
    image: /images/2025/04/4._curso_regular_privado-2016x1512-1-1024x768.jpg
    image_side: right
    heading: 2026-2027 calendar
    body: |
      The 2026-2027 year has 5 sessions: 2 in the fall, 2 in the winter and 1 in the spring.

      - **Fall 1:** August 31 – October 23
      - **Fall 2:** October 26 – December 14
      - **Winter 1:** January 4 – February 26 (registration opens November 15)
      - **Winter 2:** March 1 – April 23 (registration opens January 20)
      - **Spring:** April 26 – June 18 (registration opens March 15)

      | Level | Schedule |
      |---|---|
      | A1.1, A1.2 and A1.3 | Thursday: 5:30 – 8:45 p.m. |
      | A2.2 | Monday: 5:30 – 8:45 p.m. |
      | A2.3* | Wednesday: 6:40 – 8:40 p.m. |
      | B1.2 | Tuesday: 5:30 – 8:45 p.m. |

      \*A2.3 sessions: September 2 – November 18 // November 25 – February 24 // March 3 – May 19

  - type: text
    color: yellow
    align: center
    heading: This class is also offered privately and as an intensive course
    buttons:
      - { label: Private classes, url: "https://legados.ca/ele-adultes-cours-prives/", style: outline }
