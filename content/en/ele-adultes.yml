  - type: text
    image: /images/2025/10/cours-espagnol-montreal-prof-et-eleves.jpg
    image_side: left
    heading: The placement test
    body: |
      This class has several levels, so you need to take a placement test — unless you are a complete beginner (in which case you start at A1.1).

      The levels:

      - **A** = beginner (with sub-levels A1.1, A1.2, A2.1, etc.)
      - **B** = intermediate (with sub-levels)
      - **C** = advanced (with sub-levels)

      At Legados, classes range from A1 to C1.
    buttons:
      - { label: I want to take a placement test, url: "https://legados.ca/test-de-classement/" }

  - type: cards
    color: grey
    heading: What you will learn
    cards:
      - title: Everyday Spanish
        text: |
          Classes focus on real-life use of the language, including:

          - grammar and vocabulary applied to concrete situations
          - reading and listening comprehension
          - reading, writing and active listening
      - title: Conversation, pronunciation and culture
        text: |
          Special attention is paid to speaking:

          - better pronunciation and fluency
          - more confidence when speaking
          - exploring cultural and social questions of the Spanish-speaking world
      - title: Intercultural skills
        text: |
          You will develop:

          - a better understanding of cultural diversity
          - the ability to interact sensitively in a variety of Hispanic contexts

  - type: text
    image: /images/2026/03/Multiblocs.svg
    image_shape: plain
    heading: About the classes
    body: |
      ### Teaching material and resources
      - Specialized teaching material designed for full immersion.
      - Access to our [library of Spanish books](page:bibliotheque).
      - Cultural workshops built into our [Cultural experience](page:culture) program.

      ### Teaching staff
      Classes are taught by highly qualified teachers who specialize in teaching Spanish as a foreign language.

      ### Textbooks
      Beginner levels (A1-A2) use the [Experiencias modular](https://lasamericas.ca/fr/produits/29904/experiencias-modular-a1-libro-1) books. Intermediate level B1 uses [En Plural](https://lasamericas.ca/fr/produits/39668/en-plural-b1-libro-alumno).

  - type: people
    heading: Teacher
    people:
      - name: Meli Marín
        photo: /images/2026/04/Meli-Marin_profe-ELE-adultos-y-Bibliotecaria-926x1024.webp
        bio: |
          “My name is Melina Marín and I live in Córdoba, Argentina. For more than 20 years I have taught English and Spanish, with the joy of guiding people every day as they discover a new language. What ties me to Legados is the pleasure of passing things on, and the wish to open, through Spanish, a window on our language and culture.”

