  - type: text
    color: blue
    columns: 2
    body: |
      Legados’s Spanish classes for adults offer a complete, effective and fast learning experience, aligned with the [Common European Framework of Reference for Languages (CEFR)](https://www.coe.int/en/web/common-european-framework-reference-languages), a level system recognized worldwide.

      We guarantee steady progress in your learning (speaking, reading, writing, listening and understanding cultures). You will be guided by highly qualified teachers who use innovative methods adapted to learners’ needs.

      **The focus is on culture, the arts and everyday life.**

  - type: facts
    color: orange
