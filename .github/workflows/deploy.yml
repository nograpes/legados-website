# Builds the website and uploads it to Koumbit by FTP.
# Runs whenever something changes on main (e.g. a save in Pages CMS), and on demand
# from the Actions tab.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # lets the image import commit downloaded photos

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: America/Montreal
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # While the old WordPress site is online: fetch any image the content uses that
      # isn't in the repository yet, and commit it.
      - name: Import missing images from legados.ca
        run: |
          python import_images.py
          if [ -n "$(git status --porcelain static/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add static/images
            git commit -m "Import images from legados.ca"
            git push
          fi

      - name: Build site
        run: python build.py

      # FTP details are stored in the repository's Settings → Secrets and variables → Actions:
      #   secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      #   variables: FTP_SERVER_DIR (folder on Koumbit, ending in /), FTP_PROTOCOL (ftps or ftp)
      # Until the secrets exist, the site is built but not uploaded.
      - name: Upload to Koumbit
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
