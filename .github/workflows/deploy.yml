# Builds the website and uploads it to Koumbit by FTP.
# PAUSED 2026-11-23: the site was taken down at Aman's request, so this no longer runs on
# every push. To publish again, run it from the Actions tab (or restore the push trigger:
#   push:
#     branches: [main]
# ).
name: Build and publish

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # lets the image import commit downloaded photos

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: America/Montreal
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # While the old WordPress site is online: fetch any image the content uses that
      # isn't in the repository yet, and commit it.
      - name: Import missing images from legados.ca
        run: |
          python import_images.py
          if [ -n "$(git status --porcelain static/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add static/images
            git commit -m "Import images from legados.ca"
            git push
          fi

      - name: Build site
        run: python build.py

      # Folder on Koumbit: secret or variable FTP_SERVER_DIR (e.g. "legados"); the FTP
      # action needs it to end with "/". Empty = the FTP account's top folder.
      - name: Work out the FTP folder
        env:
          DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        run: |
          DIR="${DIR#/}"
          if [ -z "$DIR" ] || [ "$DIR" = "." ] || [ "$DIR" = "./" ]; then DIR="./"; else DIR="${DIR%/}/"; fi
          echo "FTP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Uploading to: $DIR"

      # FTP details are stored in the repository's Settings → Secrets and variables → Actions:
      #   secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      #   FTP_SERVER_DIR (secret or variable): folder on Koumbit, e.g. legados
      #   variable FTP_PROTOCOL (ftps or ftp, default ftps)
      # Until the secrets exist, the site is built but not uploaded.
      - name: Upload to Koumbit
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ env.FTP_DIR }}
